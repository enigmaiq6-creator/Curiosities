name: Auto Generate and Publish Curiosity Shorts (English Edition)

on:
  # 1. Automatic Cron Schedule (6 Videos per Day)
  schedule:
    - cron: '0 9 * * *'   # 4:00 AM local time (UTC-5) - Early morning / Global audience
    - cron: '0 11 * * *'  # 6:00 AM local time (UTC-5) - Morning wake-up
    - cron: '0 13 * * *'  # 8:00 AM local time (UTC-5) - Breakfast / Morning commute
    - cron: '0 17 * * *'  # 12:00 PM local time (UTC-5) - Lunchtime break
    - cron: '0 21 * * *'  # 4:00 PM local time (UTC-5) - Afternoon commute
    - cron: '0 1 * * *'   # 8:00 PM local time (UTC-5) - Prime-time evening

  # 2. Manual Trigger from GitHub UI
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic (Leave blank for infinite autonomous AI topic generation)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 with pip caching
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install Static FFmpeg & FFprobe (Instant 2-second setup)
      - name: Setup Static FFmpeg
        run: |
          mkdir -p $HOME/.ffmpeg-bin
          curl -sL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64 -o $HOME/.ffmpeg-bin/ffmpeg
          curl -sL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-linux-x64 -o $HOME/.ffmpeg-bin/ffprobe
          chmod +x $HOME/.ffmpeg-bin/ffmpeg $HOME/.ffmpeg-bin/ffprobe
          echo "$HOME/.ffmpeg-bin" >> $GITHUB_PATH

      # Step 4: Install Python dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Run 100% English Pipeline with Infinite AI Topic Generation
      - name: Run Curiosity Video Generator & Publisher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python auto_pipeline.py --topic "${{ github.event.inputs.topic }}"
          else
            python auto_pipeline.py
          fi

      # Step 6: Commit and Push Persistent History (Guarantees NEVER repeating a topic)
      - name: Commit and Push History State
        if: always()
        run: |
          git config --global user.name "Curiosities Bot"
          git config --global user.email "bot@curiosities.internal"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(history): update published topics database [skip ci]" && git push origin master)

      # Step 7: Save generated video output as backup artifact
      - name: Save Video Output Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-curiosity-video
          path: |
            output/*.mp4
            output/*.txt
          retention-days: 7
